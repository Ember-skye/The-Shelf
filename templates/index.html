<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Shelf</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header class="app-header">
  <div class="header-inner">
    <div class="header-top">
      <div><div class="eyebrow">Personal Archive</div><h1 class="title">The Shelf</h1></div>
      <div class="header-actions">
        <span id="saveState" class="save-state">all saved</span>
        <button id="themeToggle" class="icon-btn" aria-label="Toggle light and dark mode" title="Toggle theme">
          <svg id="iconSun" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"></path></svg>
          <svg id="iconMoon" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:none"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
        </button>
      </div>
    </div>
    <nav class="tabs" role="tablist">
      <button class="tab active" data-tab="anime" role="tab" aria-selected="true">Anime <span class="count" id="countAnime">0</span></button>
      <button class="tab" data-tab="movies" role="tab" aria-selected="false">Movies <span class="count" id="countMovies">0</span></button>
      <button class="tab" data-tab="cartoons" role="tab" aria-selected="false">Cartoons <span class="count" id="countCartoons">0</span></button>
      <button class="tab" data-tab="series" role="tab" aria-selected="false">Series <span class="count" id="countSeries">0</span></button>
    </nav>
  </div>
</header>
<div class="controls-bar">
  <div class="controls-inner">
    <div class="status-filters" id="statusFilters">
      <button class="chip active" data-status="all">All <span id="cAll">0</span></button>
      <button class="chip" data-status="watching"><span class="dot dot-watching"></span>Watching <span id="cWatching">0</span></button>
      <button class="chip" data-status="watched"><span class="dot dot-watched"></span>Watched <span id="cWatched">0</span></button>
      <button class="chip" data-status="planning"><span class="dot dot-planning"></span>Planning <span id="cPlanning">0</span></button>
    </div>
    <div class="search-add">
      <select id="genreFilter" class="filter-select" aria-label="Filter by genre"><option value="">All genres</option></select>
      <select id="yearFilter" class="filter-select" aria-label="Filter by release year"><option value="">All years</option></select>
      <select id="ratingFilter" class="filter-select" aria-label="Filter by rating"><option value="">All ratings</option><option value="9">9+ rating</option><option value="8">8+ rating</option><option value="7">7+ rating</option><option value="6">6+ rating</option></select>
      <select id="sortBy" class="filter-select" aria-label="Sort library"><option value="title">Title: A–Z</option><option value="rating">Rating: highest</option><option value="year">Year: newest</option></select>
      <div class="search-wrap"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="search-icon"><circle cx="11" cy="11" r="8"></circle><path d="M21 21l-4.35-4.35"></path></svg><input id="searchInput" type="search" placeholder="Search title or genre"></div>
      <button id="addBtn" class="btn-accent"><span aria-hidden="true">+</span><span id="addBtnLabel">Add anime</span></button>
    </div>
  </div>
</div>
<main class="main">
  <div id="emptyState" class="empty-state" style="display:none"><div class="empty-title" id="emptyTitle">Empty shelf</div><div class="empty-sub" id="emptySub">Add your first entry to start the collection.</div></div>
  <div id="grid" class="grid"></div>
</main>

<div id="modalOverlay" class="modal-overlay" style="display:none">
  <form id="entryForm" class="modal" enctype="multipart/form-data">
    <div class="modal-head"><div class="modal-title" id="modalTitle">Add anime</div><button type="button" id="closeModal" class="icon-btn" aria-label="Close">x</button></div>
    <input type="hidden" id="entryId">
    <label class="field"><span class="field-label">Title</span><input id="fieldTitle" type="text" required placeholder="e.g. Frieren"></label>
    <div id="seriesFields">
      <div class="field series-picker">
        <span id="seriesLabel" class="field-label">Add to an existing anime (optional)</span>
        <div class="series-search-wrap">
          <input id="fieldSeriesSearch" type="search" autocomplete="off" placeholder="Search an anime title to group with it">
          <button id="clearSeriesSource" class="clear-series" type="button" aria-label="Clear selected title" hidden>Clear</button>
        </div>
        <input id="fieldSeriesTitle" type="hidden">
        <div id="seriesSearchResults" class="series-results" hidden></div>
        <span id="seriesSourceHint" class="field-hint">Search and choose an existing title to create a sequel, season, or film group.</span>
      </div>
    </div>
    <label class="field poster-field"><span class="field-label">Cover poster</span><div class="poster-upload"><div class="poster-preview" id="posterPreview">Image</div><div class="poster-upload-controls"><input id="fieldPoster" type="file" accept="image/png,image/jpeg,image/webp,image/gif"><button type="button" id="removePosterBtn" class="link-btn" style="display:none">Remove image</button></div></div></label>
    <div id="metadataFields">
      <div class="field-row">
        <label class="field"><span class="field-label">Release year</span><input id="fieldReleaseDate" type="number" min="1800" max="3000" step="1" placeholder="e.g. 2026"></label>
        <label class="field"><span class="field-label">Release state</span><select id="fieldAiringStatus"></select></label>
      </div>
      <label class="field"><span class="field-label">Genres</span><div id="genreChips" class="genre-chips"></div><input id="genreSearch" type="search" autocomplete="off" placeholder="Search or add a genre"><input id="fieldGenres" type="hidden"><div id="genreSuggestions" class="genre-suggestions"></div><span class="field-hint">Choose a genre, then select another recommendation. Selected genres are not suggested again.</span></label>
      <label class="field"><span class="field-label">Author / creator</span><input id="fieldAuthor" type="text" placeholder="e.g. creator, director, studio"></label>
        <div id="watchFields">
      <div class="field-row">
        <label class="field" style="flex:1"><span class="field-label">Watch status</span><select id="fieldStatus"><option value="planning">Planning</option><option value="watching">Watching</option><option value="watched">Watched</option></select></label>
        <label class="field score-field"><span class="field-label">Score</span><input id="fieldScore" type="number" min="0" max="10" step="0.5" placeholder="0-10"></label>
      </div>
      <div class="field-row" id="episodeFields">
        <label class="field" style="flex:1"><span class="field-label">Episodes watched</span><input id="fieldEpWatched" type="number" min="0" placeholder="0"></label>
        <label class="field" style="flex:1"><span class="field-label">Total episodes</span><input id="fieldEpTotal" type="number" min="0" placeholder="?"></label>
      </div>
    </div>
    </div>
    <button type="submit" class="btn-accent btn-full" id="submitBtn">Add to shelf</button>
  </form>
</div>

<div id="posterViewer" class="poster-viewer" style="display:none" role="dialog" aria-modal="true" aria-label="Poster preview">
  <button id="closePosterViewer" class="icon-btn poster-viewer-close" type="button" aria-label="Close poster preview">x</button>
  <img id="posterViewerImage" alt="">
</div>

<div id="detailOverlay" class="modal-overlay detail-overlay" style="display:none">
  <section class="detail-modal" role="dialog" aria-modal="true" aria-labelledby="detailTitle">
    <div class="modal-head"><div><div class="eyebrow" id="detailKicker"></div><div class="modal-title" id="detailTitle"></div></div><button type="button" id="closeDetail" class="icon-btn" aria-label="Close">x</button></div>
    <div id="detailContent" class="detail-content"></div>
  </section>
</div>
<script src="/static/app.js"></script>
</body>
</html>
